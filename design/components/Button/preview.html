<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Button</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{padding:24px;background:var(--background)}</style></head>
<body class="">
<div class="ir-stack" style="gap:16px">
<div class="ir-row" style="gap:8px;flex-wrap:wrap"><button class="ir-btn ir-btn-primary"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg>Nouvelle demande</button><button class="ir-btn ir-btn-primary is-hover">Survol</button><button class="ir-btn ir-btn-primary ir-focus">Focus</button><button class="ir-btn ir-btn-primary" disabled>Désactivé</button><button class="ir-btn ir-btn-primary" disabled aria-busy="true"><svg class="ir-ico ir-spin"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Envoi…</button></div>
<div class="ir-row" style="gap:8px;flex-wrap:wrap"><button class="ir-btn ir-btn-outline">Parcourir le catalogue</button><button class="ir-btn ir-btn-ghost">Réinitialiser</button><button class="ir-btn ir-btn-danger-outline"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></svg>Refuser</button><button class="ir-btn ir-btn-danger">Annuler la demande</button><button class="ir-btn ir-btn-outline ir-btn-sm">Voir</button><button class="ir-btn ir-btn-ghost ir-btn-icon" aria-label="Notifications"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button></div></div>
</body>
</html>
