<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Input</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{padding:24px;background:var(--background)}</style></head>
<body class="">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:720px">
<div class="ir-field"><label class="ir-field-label" for="a">Adresse e-mail</label><input class="ir-input" id="a" placeholder="prenom.nom@entreprise.ci"></div>
<div class="ir-field"><label class="ir-field-label" for="b">Focus</label><input class="ir-input is-focus" id="b" value="awa.kone@entreprise.ci"></div>
<div class="ir-field"><label class="ir-field-label" for="c">Nom <span style="color:var(--danger-text)" aria-hidden="true">*</span></label><input class="ir-input is-invalid" id="c" aria-invalid="true" aria-describedby="c-e"><p class="ir-field-error" id="c-e" style="margin:0"><svg class="ir-ico ir-ico-sm"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <line x1="12" x2="12" y1="8" y2="12"/> <line x1="12" x2="12.01" y1="16" y2="16"/></svg>Le nom est obligatoire.</p></div>
<div class="ir-field"><label class="ir-field-label" for="d">Recherche</label><div class="ir-input-wrap"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/> <path d="m21 21-4.3-4.3"/></svg><input class="ir-input has-lead" id="d" placeholder="Rechercher une référence…"></div><span class="ir-field-hint">Format : REQ-2026-000012</span></div></div>
</body>
</html>
