<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>QuantityStepper</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{padding:24px;background:var(--background)}</style></head>
<body class="">
<div class="ir-row" style="gap:24px;align-items:flex-start"><div class="ir-stepper" role="group" aria-label="Quantité"><button aria-label="Diminuer"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><output>1</output><button aria-label="Augmenter"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg></button></div>
<div class="ir-stack" style="gap:6px"><div class="ir-stepper is-invalid" role="group" aria-label="Quantité" aria-invalid="true"><button aria-label="Diminuer"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><output>5</output><button aria-label="Augmenter" disabled><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg></button></div><p class="ir-field-error" style="margin:0"><svg class="ir-ico ir-ico-sm"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <line x1="12" x2="12" y1="8" y2="12"/> <line x1="12" x2="12.01" y1="16" y2="16"/></svg>Quantité supérieure au stock disponible (3).</p></div>
<div class="ir-stepper is-lg" role="group" aria-label="Quantité (mobile)"><button aria-label="Diminuer"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><output>2</output><button aria-label="Augmenter"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg></button></div></div>
</body>
</html>
