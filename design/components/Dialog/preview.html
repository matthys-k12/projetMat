<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Dialog</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{padding:24px;background:var(--background)}</style></head>
<body class="">
<div style="position:relative;height:260px;border-radius:10px;overflow:hidden"><div class="ir-overlay"><div class="ir-dialog" role="dialog" aria-modal="true" aria-labelledby="d-t"><button class="ir-btn ir-btn-ghost ir-btn-icon ir-btn-sm ir-dialog-close" aria-label="Fermer"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></svg></button><div><h2 class="ir-dialog-title" id="d-t">Nouvelle catégorie</h2><p class="ir-dialog-desc">Elle sera proposée lors de l'ajout d'un matériel.</p></div><div class="ir-field"><label class="ir-field-label" for="dn">Nom</label><input class="ir-input" id="dn" placeholder="Ex. : Téléphonie"></div><div class="ir-dialog-foot"><button class="ir-btn ir-btn-outline">Annuler</button><button class="ir-btn ir-btn-primary">Créer</button></div></div></div></div>
</body>
</html>
