<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Connexion (mobile)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{width:390px}</style></head>
<body class="">
<main style="min-height:844px;background:var(--surface);padding:48px 16px 24px;display:flex;flex-direction:column;gap:32px">
<div class="ir-stack" style="gap:32px;width:100%;max-width:360px">
  <div class="ir-row" style="gap:10px;font-weight:600;font-size:15px"><span class="ir-logo"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg></span>IT Request</div>
  <div><h1 class="ir-h1">Connexion</h1><p class="ir-muted" style="margin:4px 0 0">Accédez à vos demandes de matériel informatique.</p></div>
  <form class="ir-stack" style="gap:16px" novalidate>
    
    <div class="ir-field"><label class="ir-field-label" for="email">Adresse e-mail</label>
      <input class="ir-input" id="email" type="email" autocomplete="email" value="awa.kone@entreprise.ci" style="height:44px"></div>
    <div class="ir-field"><div class="ir-between"><label class="ir-field-label" for="pw">Mot de passe</label><a class="ir-link ir-small" href="#">Mot de passe oublié ?</a></div>
      <div class="ir-input-wrap"><input class="ir-input has-trail" id="pw" type="password" value="motdepasse"  style="height:44px"><button type="button" class="ir-btn ir-btn-ghost ir-btn-icon ir-btn-sm ir-input-trail" aria-label="Afficher le mot de passe" aria-pressed="false" style="width:40px;height:40px"><svg class="ir-ico"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/> <circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <button class="ir-btn ir-btn-primary ir-btn-block ir-btn-lg" disabled aria-busy="true"><svg class="ir-ico ir-spin"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Connexion…</button>
  </form>
  <p class="ir-caption ir-muted" style="margin:0">Problème d'accès ? Contactez le support IT au poste 4400.</p>
</div></main>
